    <style>
        :root {
            --bg-color: #f4ede4;
            --container-bg: #ffffff;
            --primary-color: #3d2b1f;
            --accent-color: #a8703f;
            --text-main: #2c1d11;
            --text-muted: #8c7667;
            --border-color: #ebdcd0;
            --highlight-bg: #fdfcfb;
        }

        html {
            background-color: var(--bg-color);
            min-height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 460px;
            margin: 0 auto;
            padding: 15px 10px;
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--container-bg);
            padding: 20px 22px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(61, 43, 31, 0.06);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .bg-abstract-top { position: absolute; top: -20px; right: 30px; width: 220px; height: 220px; opacity: 0.08; z-index: -1; pointer-events: none; }
        .bg-abstract-bottom { position: absolute; bottom: -50px; left: -40px; width: 160px; height: 160px; opacity: 0.05; z-index: -1; pointer-events: none; }

        /* 文本左缘统一基准线：卡片边缘 + 15px（带 1px 边框的容器用 14px 补偿） */
        .brand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 15px; }
        .brand-header .zh-title { font-size: 22px; font-weight: 800; color: var(--primary-color); }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .icon-btn { display: flex; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent-color); opacity: 0.8; transition: opacity 0.15s; -webkit-tap-highlight-color: transparent; }
        .icon-btn:hover, .icon-btn:focus-visible { opacity: 1; outline: none; }

        .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px); background: var(--primary-color); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(61, 43, 31, 0.22); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 999; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .input-group {
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .grid-two-columns {
            display: grid;
            /* 粉水比内容最宽仅"1 : 16.67"，固定窄列把空间让给长方案名 */
            grid-template-columns: 1fr 88px;
            gap: 12px;
            margin-bottom: 14px;
        }
        .grid-two-columns .input-group { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 6px;
            padding-left: 15px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(235, 220, 208, 0.7);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .center-display-wrapper {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            padding: 0 14px;
            box-sizing: border-box;
            cursor: pointer;
            height: 38px;
            user-select: none;
        }

        .beans-large-text {
            grid-column: 2;
            justify-self: center;
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 90px;
            text-align: center;
            line-height: 38px;
        }

        .beans-right-group {
            grid-column: 3;
            justify-self: start;
            align-self: end;
            margin-left: 6px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 16px;
        }

        .beans-unit {
            font-size: 14px;
            font-weight: 700;
            line-height: 16px;
            color: var(--text-muted);
        }

        .edit-pencil-icon {
            width: 16px;
            height: 16px;
            color: var(--accent-color);
            opacity: 0.8;
        }

        .beans-input-hidden {
            grid-column: 2;
            justify-self: center;
            display: none;
            width: 90px;
            height: 38px;
            font-family: inherit;
            font-size: 32px;
            font-weight: 800;
            line-height: 38px;
            letter-spacing: inherit;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            cursor: text;
            -moz-appearance: textfield;
        }
        .beans-input-hidden::-webkit-outer-spin-button,
        .beans-input-hidden::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .grinder-slider-box {
            position: relative;
            width: 100%;
            padding: 4px 0;
            display: flex;
            align-items: center;
            touch-action: none;
            cursor: ew-resize;
        }

        .grinder-fine-ticks {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            height: 12px;
            background:
                linear-gradient(90deg, rgba(61, 43, 31, 0.45) 1.5px, transparent 1.5px) repeat-x,
                linear-gradient(90deg, rgba(61, 43, 31, 0.22) 1px, transparent 1px) repeat-x;
            background-size: 10% 100%, 2% 55%;
            opacity: 0.9;
            pointer-events: none;
        }
        .grinder-fine-ticks::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: rgba(61, 43, 31, 0.45);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 24px;
            background: transparent;
            outline: none;
            margin: 0;
            cursor: ew-resize;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        /* 键盘焦点可见性（鼠标/触摸操作不触发） */
        .center-display-wrapper:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; border-radius: 10px; }
        input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4), 0 0 0 3px rgba(168, 112, 63, 0.35); }
        input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4), 0 0 0 3px rgba(168, 112, 63, 0.35); }
        .select-wrapper:focus-within { border-color: var(--accent-color); }

        .select-wrapper {
            position: relative;
            display: block;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--container-bg);
            overflow: hidden;
            width: 100%;
            height: 46px;
        }

        select {
            width: 100%;
            height: 100%;
            padding: 0 32px 0 14px;
            border: none;
            font-size: 14px;
            background: transparent;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 8px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            background: #fdfcfb;
            border-left: 1px solid var(--border-color);
            pointer-events: none;
        }
        .select-wrapper.locked::after { display: none; }
        .select-wrapper.locked select { cursor: default; padding-right: 14px; }
        select:disabled {
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
            opacity: 1;
        }

        .recipe-details-box { margin-top: 10px; border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; background: var(--highlight-bg); }
        summary { padding: 10px 14px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: ""; width: 5px; height: 5px; border-right: 2px solid var(--primary-color); border-bottom: 2px solid var(--primary-color); transform: rotate(45deg); }
        details[open] summary::after { transform: rotate(-135deg); }

        .recipe-details-box .details-content { display: none; }
        details[open] .details-content {
            padding: 14px;
            font-size: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            background: var(--container-bg);
        }

        .info-item { display: flex; flex-direction: column; }
        .info-item.full-width { grid-column: span 2; border-top: 1px dashed var(--border-color); padding-top: 8px; }
        .info-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .info-value { color: var(--text-main); font-weight: 600; font-size: 13px; line-height: 1.4; }
        .info-item.full-width .info-value { font-weight: 400; line-height: 1.55; }

        .result { margin-top: 16px; background-color: var(--highlight-bg); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; }
        .result h3 { margin: 0; padding: 10px 14px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 12px; }
        .result-body { padding: 10px 14px 14px; background: var(--container-bg); }
        .total-highlight { font-size: 12px; margin: 0 -8px 10px; background: #f4ede4; padding: 6px 8px; border-radius: 6px; color: var(--primary-color); }
        .nowrap { white-space: nowrap; }
        .total-highlight .sep { color: var(--text-muted); margin: 0 2px; }
        .dashboard-total { color: var(--accent-color); }
        .step { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--border-color); }
        .step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .step-title { font-weight: 700; color: var(--primary-color); margin-bottom: 2px; display: flex; justify-content: space-between; font-size: 13px; }
        .step-details { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
        .step-cumulative { color: var(--primary-color); font-size: 15px; }
        .step-delta { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
        .step-time { color: var(--accent-color); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums oldstyle-nums; }
        .step-note { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

        /* iOS Safari "add to home screen" hint */
        #a2hs {
            position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
            transform: translateX(-50%) translateY(20px);
            width: calc(100% - 28px); max-width: 380px;
            background: var(--container-bg); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 18px;
            filter: drop-shadow(0 4px 14px rgba(61, 43, 31, 0.10));
            padding: 14px 16px; display: flex; align-items: center; gap: 12px;
            opacity: 0; pointer-events: none; z-index: 9999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #a2hs.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        #a2hs .a2hs-txt { flex: 1; font-size: 13px; line-height: 1.45; }
        #a2hs .a2hs-txt b { display: block; font-size: 14px; font-weight: 800; color: var(--primary-color); margin-bottom: 2px; }
        #a2hs .a2hs-share { vertical-align: -3px; margin: 0 1px; color: var(--accent-color); }
        #a2hs .a2hs-close { flex: none; width: 26px; height: 26px; border: 0; background: transparent; color: var(--text-muted); font-size: 20px; line-height: 1; cursor: pointer; }
        /* down-caret toward Safari's bottom share button (iPhone); hidden on iPad */
        #a2hs.with-caret::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--container-bg); }

        /* 长时间停留后的分享提示（复用上面的卡片风格） */
        #sharePrompt {
            position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
            transform: translateX(-50%) translateY(20px);
            width: calc(100% - 28px); max-width: 380px;
            background: var(--container-bg); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 18px;
            filter: drop-shadow(0 4px 14px rgba(61, 43, 31, 0.10));
            padding: 14px 16px; display: flex; align-items: center; gap: 12px;
            opacity: 0; pointer-events: none; z-index: 9999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #sharePrompt.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        #sharePrompt .sp-txt { flex: 1; font-size: 13px; line-height: 1.45; }
        #sharePrompt .sp-txt b { display: block; font-size: 14px; font-weight: 800; color: var(--primary-color); margin-bottom: 2px; }
        #sharePrompt .sp-share { flex: none; }
        #sharePrompt .sp-close { flex: none; width: 26px; height: 26px; border: 0; background: transparent; color: var(--text-muted); font-size: 20px; line-height: 1; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <svg class="bg-abstract-top" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M10 20 L90 20 L50 85 Z" /><line x1="25" y1="44" x2="75" y2="44" stroke-dasharray="2 3" /><ellipse cx="50" cy="20" rx="20" ry="12" fill="none" stroke-width="1" transform="rotate(45 50 20)" /><path d="M40 10 C45 20 50 20 60 30" stroke-width="1.5" /></svg>
    <svg class="bg-abstract-bottom" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.2" aria-hidden="true"><path d="M10 90 C10 40, 50 30, 60 30" stroke-width="2" /><path d="M60 30 C75 30, 90 10, 85 5" stroke-width="1.5" stroke-linecap="round" /><circle cx="10" cy="90" r="30" stroke-dasharray="4 4" /></svg>

    <div class="brand-header">
        <div class="brand-titles">
            <div class="zh-title">咖啡冲煮助手</div>
        </div>
        <div class="header-actions">
            <button type="button" class="icon-btn" id="shareBtn" aria-label="分享" onclick="sharePage()">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/>
                </svg>
            </button>
            <a class="icon-btn" href="https://github.com/caic99/coffee-assistant" target="_blank" rel="noopener" aria-label="View source on GitHub">
                <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
    </div>

    <div class="input-group">
        <label for="beansSlider">咖啡粉重量:</label>
        <div class="glass-panel">
            <div class="center-display-wrapper" id="displayWrapper" role="button" tabindex="0" aria-label="编辑咖啡粉重量" onclick="enableManualInput()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();enableManualInput();}">
                <span class="beans-large-text" id="beansValue">15.0</span>
                <input type="number" id="beansInput" class="beans-input-hidden" step="0.1" min="0.1" max="9999" inputmode="decimal" aria-label="咖啡粉重量（克）" onblur="disableManualInput()">
                <div class="beans-right-group">
                    <span class="beans-unit">克</span>
                    <svg class="edit-pencil-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path>
                    </svg>
                </div>
            </div>

            <div class="grinder-slider-box">
                <div class="grinder-fine-ticks"></div>
                <input type="range" id="beansSlider" min="10" max="20" step="0.1" value="15.0" oninput="syncFromSlider(this.value)">
            </div>
        </div>
    </div>

    <div class="grid-two-columns">
        <div class="input-group">
            <label for="recipe">冲煮方案:</label>
            <div class="select-wrapper" id="recipeWrapper">
                <select id="recipe" onchange="onRecipeChange()">
                    <option value="classic" selected>经典三段式</option>

    // 分享：优先唤起系统分享面板，不支持时回退到复制链接

            });
        } else {
            copyLink(url);
        }
    }

    function copyLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url)
                .then(() => showToast('已复制链接'))
                .catch(() => showToast('复制失败，请手动复制'));
        } else {
            showToast(url);
        }

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.className = 'toast';
            t.setAttribute('role', 'status');
            document.body.appendChild(t);
        }
        t.textContent = msg;
        clearTimeout(showToast._timer);
        requestAnimationFrame(() => t.classList.add('show'));
        showToast._timer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    /* iOS Safari "Add to Home Screen" hint — Android/desktop install natively */

        const KEY = 'coffee.a2hsDismissed';
        try { if (localStorage.getItem(KEY) === '1') return; } catch (_) {}

        const ua = navigator.userAgent || '';
        const isIPad = /ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isIOS = /iphone|ipod/i.test(ua) || isIPad;
        const isSafari = !/crios|fxios|edgios/i.test(ua);                 // not Chrome/FF/Edge on iOS
        const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

            '<svg class="a2hs-share" width="17" height="17" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 15V3"/><path d="m8 7 4-4 4 4"/>' +
            '<path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>';

        const addIcon =                                                   // Safari "add to home screen" glyph: rounded square + plus
            '<svg class="a2hs-share" width="17" height="17" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8.5v7M8.5 12h7"/></svg>';

        const where = isIPad ? '顶部的分享按钮' : '下方的分享按钮';

    // 停留足够久（默认 3 分钟前台时间）后，轻量提示分享一次
    (function () {
        const KEY = 'coffee.sharePromptShown';
        const DELAY_MS = 3 * 60 * 1000;                  // 想调整时长改这里
        try { if (localStorage.getItem(KEY) === '1') return; } catch (_) {}

        let shown = false, elapsed = 0, since = Date.now(), timer = null;

        function arm() {
            if (shown) return;
            since = Date.now();
            timer = setTimeout(show, Math.max(0, DELAY_MS - elapsed));
        }
        function disarm() {
            clearTimeout(timer);
            elapsed += Date.now() - since;               // 只累计前台停留时间
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) disarm(); else arm();
        });

        function show() {
            if (shown) return;
            shown = true;
            try { localStorage.setItem(KEY, '1'); } catch (_) {}   // 整个生命周期只弹一次

            const a2hs = document.getElementById('a2hs');           // 避免和「添加到主屏幕」提示重叠

    function saveBeans(v) {

        const v = parseFloat(val).toFixed(1);
        textEl.innerText = v;

        saveBeans(v);
        renderDashboard();
    }

    function enableManualInput() {
        if (textEl.style.display === 'none') return;
        textEl.style.display = 'none';
        inputEl.style.display = 'inline-block';
        inputEl.value = textEl.innerText;
        inputEl.focus();
        inputEl.select();
    }

    function disableManualInput() {
        let val = parseFloat(inputEl.value);
        if (isNaN(val) || val <= 0) val = parseFloat(textEl.innerText) || 15;

        val = Number(val.toFixed(1));

        const sMin = parseFloat(sliderEl.min);
        const sMax = parseFloat(sliderEl.max);

        textEl.innerText = val.toFixed(1);
        inputEl.value = val.toFixed(1);
        sliderEl.value = Math.max(sMin, Math.min(sMax, val));
        saveBeans(val);

        inputEl.style.display = 'none';
        textEl.style.display = '';
        renderDashboard();
    }

    (function initRelativeDragSlider() {
        const box = document.querySelector('.grinder-slider-box');
        if (!box) return;
        let dragging = false;
        let startX = 0;
        let startValue = 0;
        let activePointerId = null;

        function onDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragging = true;
            activePointerId = e.pointerId;
            startX = e.clientX;
            startValue = parseFloat(sliderEl.value);
            try { box.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        }

        function onMove(e) {
            if (!dragging || e.pointerId !== activePointerId) return;
            const rect = box.getBoundingClientRect();
            const min = parseFloat(sliderEl.min);
            const max = parseFloat(sliderEl.max);
            const step = parseFloat(sliderEl.step) || 0.1;
            const range = max - min;
            const deltaX = e.clientX - startX;
            let v = startValue + (deltaX / rect.width) * range;
            v = Math.round(v / step) * step;
            v = Math.max(min, Math.min(max, v));
            v = Number(v.toFixed(1));
            if (parseFloat(sliderEl.value) !== v) {
                sliderEl.value = v;
                syncFromSlider(v);
            }
            e.preventDefault();
        }

        function onUp(e) {
            if (e.pointerId !== activePointerId) return;
            dragging = false;
            activePointerId = null;
            try { box.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        box.addEventListener('pointerdown', onDown);
        box.addEventListener('pointermove', onMove);
        box.addEventListener('pointerup', onUp);
        box.addEventListener('pointercancel', onUp);
    })();

    function updateRecipeDetailsView() {
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];

        document.getElementById('viewTemp').innerText = recipe.temp;
        document.getElementById('viewGear').innerText = recipe.gear;
        document.getElementById('viewGrind').innerText = recipe.grind;
        document.getElementById('viewTime').innerText = recipe.time;
        document.getElementById('viewFlavor').innerText = recipe.flavor;

        const ratioWrapper = document.getElementById('ratioWrapper');
        if (recipe.hasDynamicRatio) {
            ratioSelect.disabled = false;
            ratioWrapper.classList.remove('locked');
            if (recipe.defaultRatio) ratioSelect.value = recipe.defaultRatio;
        } else {
            ratioSelect.value = recipe.fixedRatio.toString();
            ratioSelect.disabled = true;
            ratioWrapper.classList.add('locked');
        }
    }

    function onRatioChange() {
        renderDashboard();
    }

    function applyRecipeKey(key, { writeHash = true, persist = true } = {}) {
        if (!recipes[key]) return false;
        const sel = document.getElementById('recipe');
        if (sel.value !== key) sel.value = key;
        updateRecipeDetailsView();
        if (persist) {
            try { localStorage.setItem(RECIPE_KEY, key); } catch (_) {}
        }
        if (writeHash && location.hash.replace(/^#/, '') !== key) {
            try { history.replaceState(null, '', '#' + key); } catch (_) { location.hash = key; }
        }
        return true;
    }

    function onRecipeChange() {
        applyRecipeKey(document.getElementById('recipe').value);
        renderDashboard();
    }

    window.addEventListener('hashchange', () => {
        const k = location.hash.replace(/^#/, '');
        if (recipes[k] && document.getElementById('recipe').value !== k) {
            applyRecipeKey(k, { writeHash: false });
            renderDashboard();
        }
    });

    function renderDashboard() {
        const beans = parseFloat(inputEl.value || textEl.innerText);
        if (!beans || beans <= 0) return;
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];
        if (!recipe) return;

        const activeRatio = recipe.hasDynamicRatio ? parseFloat(ratioSelect.value) : recipe.fixedRatio;
        const totalWater = beans * activeRatio;
        document.getElementById('totalWater').innerText = totalWater.toFixed(1);
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`;
        document.getElementById('currentBeans').innerText = beans.toFixed(1);

        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = '';
        let cumulativeWater = 0;

        recipe.steps.forEach((step, i) => {
            // 最后一段收敛到目标总量，避免百分比舍入导致 210.2g ≠ 210.0g 这类偏差
            const isLast = i === recipe.steps.length - 1;
            const stepWater = isLast ? totalWater - cumulativeWater : totalWater * step.percentage;
            cumulativeWater += stepWater;
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            const timeLead = step.time ? `<span class="step-time">${step.time}</span> 开始注水，<span class="nowrap">至 ` : '<span class="nowrap">注水至 ';
            stepDiv.innerHTML = `<div class="step-title">${step.name}</div><div class="step-details">${timeLead}<strong class="step-cumulative">${cumulativeWater.toFixed(1)}g</strong></span> <span class="step-delta">· +${stepWater.toFixed(1)}g, ${(step.percentage * 100).toFixed(0)}%</span></div><div class="step-note">${step.note}</div>`;
            stepsList.appendChild(stepDiv);
        });
    }

    const detailsEl = document.getElementById('recipeDetails');
    const DETAILS_KEY = 'coffee.recipeDetailsOpen';
    detailsEl.addEventListener('toggle', () => {
        try { localStorage.setItem(DETAILS_KEY, detailsEl.open ? '1' : '0'); } catch (_) {}
    });

    window.onload = function() {
        const hashKey = location.hash.replace(/^#/, '');
        let initialRecipe = null;
        if (recipes[hashKey]) {
            initialRecipe = hashKey;
        } else {
            try {
                const stored = localStorage.getItem(RECIPE_KEY);
                if (recipes[stored]) initialRecipe = stored;
            } catch (_) {}
        }
        if (!initialRecipe) initialRecipe = 'classic';
        applyRecipeKey(initialRecipe);

        let savedBeans = NaN;
        try { savedBeans = parseFloat(localStorage.getItem(BEANS_KEY)); } catch (_) {}
        if (!isNaN(savedBeans) && savedBeans > 0) {
            const sMin = parseFloat(sliderEl.min);
            const sMax = parseFloat(sliderEl.max);
            const v = Number(savedBeans.toFixed(1));
            textEl.innerText = v.toFixed(1);
            inputEl.value = v.toFixed(1);
            sliderEl.value = Math.max(sMin, Math.min(sMax, v));
        } else {
            syncFromSlider(sliderEl.value);
        }

        let savedOpen = null;
        try { savedOpen = localStorage.getItem(DETAILS_KEY); } catch (_) {}
        if (savedOpen === '1') detailsEl.setAttribute('open', '');
        else if (savedOpen === '0') detailsEl.removeAttribute('open');

        renderDashboard();
    };
</script>

</body>
</html>
