<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Brewing Assistant · 咖啡冲煮助手 v8.2</title>

    <link rel="manifest" href="./manifest.json?v=8.3">

    <meta name="theme-color" content="#3d2b1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=8.3">
    <link rel="apple-touch-icon" href="./favicon.svg?v=8.3">

    <style>
        :root {
            --bg-color: #f4ede4;
            --container-bg: #ffffff;
            --primary-color: #3d2b1f;
            --accent-color: #a8703f;
            --text-main: #2c1d11;
            --text-muted: #8c7667;
            --border-color: #ebdcd0;
            --highlight-bg: #fdfcfb;
        }

        html {
            background-color: var(--bg-color);
            min-height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 460px;
            margin: 0 auto;
            padding: 15px 10px;
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--container-bg);
            padding: 20px 22px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(61, 43, 31, 0.06);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .bg-abstract-top { position: absolute; top: -30px; right: -40px; width: 140px; height: 140px; opacity: 0.08; z-index: -1; pointer-events: none; }
        .bg-abstract-bottom { position: absolute; bottom: -50px; left: -40px; width: 160px; height: 160px; opacity: 0.05; z-index: -1; pointer-events: none; }

        .brand-header { text-align: left; margin-bottom: 16px; padding-left: 14px; }
        .brand-header .en-title { font-size: 11px; font-weight: 700; color: var(--accent-color); text-transform: uppercase; margin-bottom: 2px; }
        .brand-header .zh-title { font-size: 20px; font-weight: 800; color: var(--primary-color); }

        .input-group {
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .grid-two-columns {
            display: grid;
            grid-template-columns: 2.1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .grid-two-columns .input-group { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 6px;
            padding-left: 14px;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(235, 220, 208, 0.7);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .center-display-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            height: 38px;
            user-select: none;
        }

        .beans-large-text {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 90px;
            text-align: center;
            line-height: 38px;
        }

        .beans-unit {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .edit-pencil-icon {
            width: 16px;
            height: 16px;
            color: var(--accent-color);
            opacity: 0.8;
            margin-top: 4px;
        }

        .beans-input-hidden {
            display: none;
            width: 90px;
            height: 38px;
            font-family: inherit;
            font-size: 32px;
            font-weight: 800;
            line-height: 38px;
            letter-spacing: inherit;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            cursor: text;
            -moz-appearance: textfield;
        }
        .beans-input-hidden::-webkit-outer-spin-button,
        .beans-input-hidden::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .grinder-slider-box {
            position: relative;
            width: 100%;
            padding: 4px 0;
            display: flex;
            align-items: center;
            touch-action: none;
            cursor: ew-resize;
        }

        .grinder-fine-ticks {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            height: 12px;
            background:
                linear-gradient(90deg, rgba(61, 43, 31, 0.45) 1.5px, transparent 1.5px) repeat-x,
                linear-gradient(90deg, rgba(61, 43, 31, 0.22) 1px, transparent 1px) repeat-x;
            background-size: 10% 100%, 2% 55%;
            opacity: 0.9;
            pointer-events: none;
        }
        .grinder-fine-ticks::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: rgba(61, 43, 31, 0.45);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 24px;
            background: transparent;
            outline: none;
            margin: 0;
            cursor: ew-resize;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 22px;
            border-radius: 2px;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 1px 5px rgba(61, 43, 31, 0.4);
        }

        .select-wrapper {
            position: relative;
            display: block;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #fff;
            overflow: hidden;
            width: 100%;
            height: 46px;
        }

        select {
            width: 100%;
            height: 100%;
            padding: 0 36px 0 12px;
            border: none;
            font-size: 14px;
            background: transparent;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 8px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            background: #fdfcfb;
            border-left: 1px solid var(--border-color);
            pointer-events: none;
        }
        .select-wrapper.locked::after { display: none; }
        .select-wrapper.locked select { cursor: default; padding-right: 12px; }
        select:disabled {
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
            opacity: 1;
        }

        .recipe-details-box { margin-top: 10px; border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; background: var(--highlight-bg); }
        summary { padding: 10px 14px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: ""; width: 5px; height: 5px; border-right: 2px solid var(--primary-color); border-bottom: 2px solid var(--primary-color); transform: rotate(45deg); }
        details[open] summary::after { transform: rotate(-135deg); }

        .recipe-details-box .details-content { display: none; }
        details[open] .details-content {
            padding: 14px 16px;
            font-size: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            background: #fff;
        }

        .info-item { display: flex; flex-direction: column; }
        .info-item.full-width { grid-column: span 2; border-top: 1px dashed #f0eae1; padding-top: 8px; }
        .info-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .info-value { color: var(--text-main); font-weight: 600; font-size: 13px; line-height: 1.4; }
        .info-item.full-width .info-value { font-weight: 400; line-height: 1.55; }

        .result { margin-top: 16px; background-color: var(--highlight-bg); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; }
        .result h3 { margin: 0; padding: 10px 14px; background: #f4ede4; color: var(--primary-color); font-weight: 700; font-size: 12px; }
        .result-body { padding: 10px 16px 14px; background: #fff; }
        .total-highlight { font-size: 12px; margin: 0 -8px 10px; background: #f4ede4; padding: 6px; border-radius: 6px; color: var(--primary-color); }
        .total-highlight .sep { color: var(--text-muted); margin: 0 2px; }
        .dashboard-total { color: var(--accent-color); }
        .step { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px dashed #e6dfd8; }
        .step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .step-title { font-weight: 700; color: var(--primary-color); margin-bottom: 2px; display: flex; justify-content: space-between; font-size: 13px; }
        .step-details { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
        .step-cumulative { color: var(--primary-color); font-size: 15px; }
        .step-delta { color: var(--text-muted); font-size: 11px; }
        .step-time { color: var(--accent-color); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums oldstyle-nums; }
        .step-note { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <svg class="bg-abstract-top" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round"><path d="M10 20 L90 20 L50 85 Z" /><line x1="25" y1="44" x2="75" y2="44" stroke-dasharray="2 3" /><circle cx="50" cy="20" r="18" fill="none" stroke-width="1" /><path d="M40 10 C45 20 50 20 60 30" stroke-width="1.5" /></svg>
    <svg class="bg-abstract-bottom" viewBox="0 0 100 100" fill="none" stroke="var(--primary-color)" stroke-width="1.2"><path d="M10 90 C10 40, 50 30, 60 30" stroke-width="2" /><path d="M60 30 C75 30, 90 10, 85 5" stroke-width="1.5" stroke-linecap="round" /><circle cx="10" cy="90" r="30" stroke-dasharray="4 4" /></svg>

    <div class="brand-header">
        <div class="en-title">Coffee Brewing Assistant</div>
        <div class="zh-title">咖啡冲煮助手</div>
    </div>

    <div class="input-group">
        <label>咖啡粉重量:</label>
        <div class="glass-panel">
            <div class="center-display-wrapper" id="displayWrapper" onclick="enableManualInput()">
                <span class="beans-large-text" id="beansValue">15.0</span>
                <input type="number" id="beansInput" class="beans-input-hidden" step="0.1" min="0.1" max="9999" inputmode="decimal" onblur="disableManualInput()">
                <span class="beans-unit">克</span>
                <svg class="edit-pencil-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path>
                </svg>
            </div>

            <div class="grinder-slider-box">
                <div class="grinder-fine-ticks"></div>
                <input type="range" id="beansSlider" min="10" max="20" step="0.1" value="15.0" oninput="syncFromSlider(this.value)">
            </div>
        </div>
    </div>

    <div class="grid-two-columns">
        <div class="input-group">
            <label for="recipe">冲煮方案:</label>
            <div class="select-wrapper" id="recipeWrapper">
                <select id="recipe" onchange="onRecipeChange()">
                    <option value="classic" selected>经典三段式</option>
                    <option value="one_pour">极致一刀流</option>
                    <option value="perger">Matt Perger 教学版 (2012)</option>
                    <option value="four_six">粕谷哲 四六冲煮法 (2016)</option>
                    <option value="fukahori">Emi Fukahori 三温度浸泡 (2018)</option>
                    <option value="du">杜嘉宁 高温快冲法 (2019)</option>
                    <option value="winton">Matt Winton 五段无搅 (2021)</option>
                    <option value="hsu">Sherry Hsu 双温度 (2022)</option>
                    <option value="carlos">Carlos Medina 五段精准法 (2023)</option>
                    <option value="wolfl">Martin Wölfl Orea V4 快冲 (2024)</option>
                    <option value="peng">George Peng SOLO 双温度 (2025)</option>
                    <option value="hoffmann">James Hoffmann Ultimate V60</option>
                    <option value="rao">Scott Rao 高萃取版</option>
                    <option value="x_method">彭近洋 无差别冲煮法</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="ratio">粉水比:</label>
            <div class="select-wrapper" id="ratioWrapper">
                <select id="ratio" onchange="onRatioChange()">
                    <option value="15">1 : 15</option>
                    <option value="16">1 : 16</option>
                    <option value="13"    style="display:none;">1 : 13</option>
                    <option value="14"    style="display:none;">1 : 14</option>
                    <option value="14.3"  style="display:none;">1 : 14.3</option>
                    <option value="15.9"  style="display:none;">1 : 15.9</option>
                    <option value="16.1"  style="display:none;">1 : 16.1</option>
                    <option value="16.5"  style="display:none;">1 : 16.5</option>
                    <option value="16.67" style="display:none;">1 : 16.67</option>
                </select>
            </div>
        </div>
    </div>

    <details class="recipe-details-box" id="recipeDetails">
        <summary>冲煮方案</summary>
        <div class="details-content">
            <div class="info-item"><span class="info-label">推荐水温</span><span class="info-value" id="viewTemp">-</span></div>
            <div class="info-item"><span class="info-label">推荐器具</span><span class="info-value" id="viewGear">-</span></div>
            <div class="info-item"><span class="info-label">研磨度锚点</span><span class="info-value" id="viewGrind">-</span></div>
            <div class="info-item"><span class="info-label">预估时间</span><span class="info-value" id="viewTime">-</span></div>
            <div class="info-item full-width"><span class="info-label">方案核心设计哲学</span><span class="info-value" id="viewFlavor">-</span></div>
        </div>
    </details>

    <div id="resultBox" class="result">
        <h3>冲煮看板</h3>
        <div class="result-body">
            <div class="total-highlight">
                目标注水：<strong id="totalWater" class="dashboard-total"></strong> g
                <span class="sep">|</span> 粉水比：<strong><span id="currentRatio"></span></strong>
                <span class="sep">|</span> 咖啡粉重量：<strong id="currentBeans"></strong> g
            </div>
            <div id="stepsList"></div>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js?v=8.3')
                .then(reg => console.log('PWA 已成功部署。'))
                .catch(err => console.log(err));
        });
    }

    const sliderEl = document.getElementById('beansSlider');
    const textEl = document.getElementById('beansValue');
    const inputEl = document.getElementById('beansInput');
    const ratioSelect = document.getElementById('ratio');

    const RECIPE_KEY = 'coffee.recipe';
    const BEANS_KEY = 'coffee.beans';

    function saveBeans(v) {
        try { localStorage.setItem(BEANS_KEY, parseFloat(v).toFixed(1)); } catch (_) {}
    }

    function syncFromSlider(val) {
        const v = parseFloat(val).toFixed(1);
        textEl.innerText = v;
        inputEl.value = v;
        saveBeans(v);
        renderDashboard();
    }

    function enableManualInput() {
        if (textEl.style.display === 'none') return;
        textEl.style.display = 'none';
        inputEl.style.display = 'inline-block';
        inputEl.value = textEl.innerText;
        inputEl.focus();
        inputEl.select();
    }

    function disableManualInput() {
        let val = parseFloat(inputEl.value);
        if (isNaN(val) || val <= 0) val = parseFloat(textEl.innerText) || 15;

        val = Number(val.toFixed(1));

        const sMin = parseFloat(sliderEl.min);
        const sMax = parseFloat(sliderEl.max);

        textEl.innerText = val.toFixed(1);
        inputEl.value = val.toFixed(1);
        sliderEl.value = Math.max(sMin, Math.min(sMax, val));
        saveBeans(val);

        inputEl.style.display = 'none';
        textEl.style.display = '';
        renderDashboard();
    }

    (function initRelativeDragSlider() {
        const box = document.querySelector('.grinder-slider-box');
        if (!box) return;
        let dragging = false;
        let startX = 0;
        let startValue = 0;
        let activePointerId = null;

        function onDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragging = true;
            activePointerId = e.pointerId;
            startX = e.clientX;
            startValue = parseFloat(sliderEl.value);
            try { box.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        }

        function onMove(e) {
            if (!dragging || e.pointerId !== activePointerId) return;
            const rect = box.getBoundingClientRect();
            const min = parseFloat(sliderEl.min);
            const max = parseFloat(sliderEl.max);
            const step = parseFloat(sliderEl.step) || 0.1;
            const range = max - min;
            const deltaX = e.clientX - startX;
            let v = startValue + (deltaX / rect.width) * range;
            v = Math.round(v / step) * step;
            v = Math.max(min, Math.min(max, v));
            v = Number(v.toFixed(1));
            if (parseFloat(sliderEl.value) !== v) {
                sliderEl.value = v;
                syncFromSlider(v);
            }
            e.preventDefault();
        }

        function onUp(e) {
            if (e.pointerId !== activePointerId) return;
            dragging = false;
            activePointerId = null;
            try { box.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        box.addEventListener('pointerdown', onDown);
        box.addEventListener('pointermove', onMove);
        box.addEventListener('pointerup', onUp);
        box.addEventListener('pointercancel', onUp);
    })();

    const recipes = {
        classic: {
            hasDynamicRatio: true,
            defaultRatio: "15",
            temp: "91℃ - 93℃",
            gear: "V60 / 蛋糕滤杯均可",
            grind: "中等研磨，日常基准",
            time: "2'15\" - 2'45\"",
            flavor: "最普及的经典日常风味校准模型。通过均匀拆分三段水量平衡整体的酸、甜与浓度，不挑咖啡豆的烘焙度与产区，极高容错率。如果在面对一支新拿到的豆子不知道如何下手时，推荐先用此方案测试豆子的基本风味轮廓。",
            steps: [
                { name: "第一段 · 闷蒸",     time: "0:00", percentage: 0.20, note: "充分打湿粉床，闷蒸 30 秒以均匀释放二氧化碳气体。" },
                { name: "第二段 · 核心萃取", time: "0:45", percentage: 0.40, note: "由内向外稳定绕圈，稳定均匀水流，全力逼出中段高甜感。" },
                { name: "第三段 · 尾段稀释", time: "1:30", percentage: 0.40, note: "转为平稳的中心温柔注水，避免过度扰动引起尾段杂质与苦涩。" },
            ],
        },
        four_six: {
            hasDynamicRatio: false,
            fixedRatio: 15,
            temp: "浅烘93℃ / 中烘88℃ / 深烘83℃",
            gear: "Hario V60-02 经典螺旋纹",
            grind: "粗研磨，砂糖质感颗粒",
            time: "3'15\" - 3'30\"",
            flavor: "粕谷哲世界冠军成名作。将总注水量解构为 4:6 两阶段。前 40% 的前两注用于决定酸甜平衡，第一注少则偏甜；后 60% 的三注用于控制最终浓度。因为采用了极粗的研磨度，所以强烈建议针对咖啡豆的不同烘焙度实施严格的降温策略，例如深烘低至 83℃以保障甜感且完全避开焦苦。",
            steps: [
                { name: "第一段 · 决定酸度", time: "0:00", percentage: 0.20, note: "快速注入。粗研磨下释放轻快、明亮的酸质活力。" },
                { name: "第二段 · 决定甜度", time: "0:45", percentage: 0.20, note: "若追求更高的高厚甜感，此段水量可适当增加。" },
                { name: "第三段 · 提升浓度", time: "1:25", percentage: 0.20, note: "后三段每次注水前，务必等待滤杯内的咖啡液完全流干、粉床露出后再行注入下一段。" },
                { name: "第四段 · 控制流速", time: "2:05", percentage: 0.20, note: "保持断水节奏，精准稳定重力水流。" },
                { name: "第五段 · 最后收尾", time: "2:35", percentage: 0.20, note: "灌入最后1/5水量，随后静置，等待最后滴滤滤干完成。" },
            ],
        },
        one_pour: {
            hasDynamicRatio: false,
            fixedRatio: 16,
            temp: "90℃ - 92℃",
            gear: "Origami / V60 均可",

    function updateRecipeDetailsView() {
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];

        document.getElementById('viewTemp').innerText = recipe.temp;
        document.getElementById('viewGear').innerText = recipe.gear;
        document.getElementById('viewGrind').innerText = recipe.grind;
        document.getElementById('viewTime').innerText = recipe.time;
        document.getElementById('viewFlavor').innerText = recipe.flavor;

        const ratioWrapper = document.getElementById('ratioWrapper');
        if (recipe.hasDynamicRatio) {
            ratioSelect.disabled = false;
            ratioWrapper.classList.remove('locked');
            if (recipe.defaultRatio) ratioSelect.value = recipe.defaultRatio;
        } else {
            ratioSelect.value = recipe.fixedRatio.toString();
            ratioSelect.disabled = true;
            ratioWrapper.classList.add('locked');
        }
    }

    function onRatioChange() {
        renderDashboard();
    }

    function applyRecipeKey(key, { writeHash = true, persist = true } = {}) {
        if (!recipes[key]) return false;
        const sel = document.getElementById('recipe');
        if (sel.value !== key) sel.value = key;
        updateRecipeDetailsView();
        if (persist) {
            try { localStorage.setItem(RECIPE_KEY, key); } catch (_) {}
        }
        if (writeHash && location.hash.replace(/^#/, '') !== key) {
            try { history.replaceState(null, '', '#' + key); } catch (_) { location.hash = key; }
        }
        return true;
    }

    function onRecipeChange() {
        applyRecipeKey(document.getElementById('recipe').value);
        renderDashboard();
    }

    window.addEventListener('hashchange', () => {
        const k = location.hash.replace(/^#/, '');
        if (recipes[k] && document.getElementById('recipe').value !== k) {
            applyRecipeKey(k, { writeHash: false });
            renderDashboard();
        }
    });

    function renderDashboard() {
        const beans = parseFloat(inputEl.value || textEl.innerText);
        if (!beans || beans <= 0) return;
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];
        if (!recipe) return;

        const activeRatio = recipe.hasDynamicRatio ? parseFloat(ratioSelect.value) : recipe.fixedRatio;
        const totalWater = beans * activeRatio;
        document.getElementById('totalWater').innerText = totalWater.toFixed(1);
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`;
        document.getElementById('currentBeans').innerText = beans.toFixed(1);

        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = '';
        let cumulativeWater = 0;

        recipe.steps.forEach((step) => {
            const stepWater = totalWater * step.percentage;
            cumulativeWater += stepWater;
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            const timeLead = step.time ? `<span class="step-time">${step.time}</span> 开始注水，至 ` : '注水至 ';
            stepDiv.innerHTML = `<div class="step-title">${step.name}</div><div class="step-details">${timeLead}<strong class="step-cumulative">${cumulativeWater.toFixed(1)}g</strong> <span class="step-delta">· +${stepWater.toFixed(1)}g, ${(step.percentage * 100).toFixed(0)}%</span></div><div class="step-note">${step.note}</div>`;
            stepsList.appendChild(stepDiv);
        });
    }

    const detailsEl = document.getElementById('recipeDetails');
    const DETAILS_KEY = 'coffee.recipeDetailsOpen';
    detailsEl.addEventListener('toggle', () => {
        try { localStorage.setItem(DETAILS_KEY, detailsEl.open ? '1' : '0'); } catch (_) {}
    });

    window.onload = function() {
        const hashKey = location.hash.replace(/^#/, '');
        let initialRecipe = null;
        if (recipes[hashKey]) {
            initialRecipe = hashKey;
        } else {
            try {
                const stored = localStorage.getItem(RECIPE_KEY);
                if (recipes[stored]) initialRecipe = stored;
            } catch (_) {}
        }
        if (!initialRecipe) initialRecipe = 'classic';
        applyRecipeKey(initialRecipe);

        let savedBeans = NaN;
        try { savedBeans = parseFloat(localStorage.getItem(BEANS_KEY)); } catch (_) {}
        if (!isNaN(savedBeans) && savedBeans > 0) {
            const sMin = parseFloat(sliderEl.min);
            const sMax = parseFloat(sliderEl.max);
            const v = Number(savedBeans.toFixed(1));
            textEl.innerText = v.toFixed(1);
            inputEl.value = v.toFixed(1);
            sliderEl.value = Math.max(sMin, Math.min(sMax, v));
        } else {
            syncFromSlider(sliderEl.value);
        }

        let savedOpen = null;
        try { savedOpen = localStorage.getItem(DETAILS_KEY); } catch (_) {}
        if (savedOpen === '1') detailsEl.setAttribute('open', '');
        else if (savedOpen === '0') detailsEl.removeAttribute('open');

        renderDashboard();
    };
</script>

</body>
</html>
