<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Brewing Assistant · 咖啡冲煮助手 v6.0</title>

    <link rel="manifest" href="./manifest.json?v=6.0">

    <meta name="theme-color" content="#2b1d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=6.0">
    <link rel="apple-touch-icon" href="./favicon.svg?v=6.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,30..100,0..1;1,9..144,300..600,30..100,0..1&display=swap">

    <style>
        :root {
            --paper:        #efe7d8;
            --paper-soft:   #f6efe1;
            --card:         #fffaf0;
            --ink:          #1a0e07;
            --espresso:     #2b1d12;
            --crema:        #b97a3e;
            --crema-soft:   #d6a274;
            --text-main:    #2c1d11;
            --text-muted:   #8a7660;
            --rule:         #d9c9b6;

            /* Legacy aliases */
            --bg-color:       var(--paper);
            --container-bg:   var(--card);
            --primary-color:  var(--espresso);
            --accent-color:   var(--crema);
            --border-color:   var(--rule);
            --highlight-bg:   var(--paper-soft);

            --serif: "Fraunces", "Iowan Old Style", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
            --sans:  -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes inkFlash {
            0%   { opacity: 0.35; }
            100% { opacity: 1; }
        }

        html {
            background-color: var(--paper);
            min-height: 100%;
        }
        body {
            font-family: var(--sans);
            background-color: var(--paper);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 18px 12px 32px;
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        body::before {
            /* paper grain */
            content: "";
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.7 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
        }
        ::selection { background: var(--crema); color: var(--paper-soft); }

        .container {
            background: var(--card);
            padding: 0 20px 22px;
            border-radius: 4px;
            box-shadow:
                0 1px 0 var(--rule) inset,
                0 14px 36px rgba(43, 29, 18, 0.10),
                0 1px 2px rgba(43, 29, 18, 0.06);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .bg-abstract-top, .bg-abstract-bottom { display: none; }

        .edition-mark {
            position: absolute;
            top: 16px;
            right: 18px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            z-index: 3;
            font-variant-numeric: oldstyle-nums;
        }

        /* === MASTHEAD === */
        .brand-header {
            text-align: center;
            padding: 32px 0 20px;
            border-bottom: 1px solid var(--ink);
            position: relative;
            margin-bottom: 26px;
            animation: fadeUp 700ms 60ms both;
        }
        .brand-header::before {
            content: "";
            display: block;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            height: 3px;
            margin: 0 0 22px;
        }
        .brand-header .en-title {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 500;
            font-variation-settings: "SOFT" 60, "WONK" 1, "opsz" 144;
            color: var(--ink);
            letter-spacing: -0.015em;
            line-height: 1.05;
            margin-bottom: 8px;
            text-transform: none;
        }
        .brand-header .zh-title {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }
        .brand-header .zh-title em {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-main);
            font-variant-numeric: oldstyle-nums;
        }

        .input-group {
            margin-bottom: 22px;
            position: relative;
            z-index: 2;
            animation: fadeUp 600ms 240ms both;
        }

        .grid-two-columns {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 14px;
            margin-bottom: 22px;
            animation: fadeUp 600ms 340ms both;
        }
        .grid-two-columns .input-group { margin-bottom: 0; animation: none; }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--sans);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 9.5px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        /* === DOSE — hero pull quote === */
        .glass-panel {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            border-radius: 0;
            padding: 22px 0 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .center-display-wrapper {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
            cursor: pointer;
            height: auto;
            user-select: none;
        }

        .beans-large-text {
            font-family: var(--serif);
            font-size: 68px;
            font-weight: 500;
            font-variation-settings: "SOFT" 40, "WONK" 1, "opsz" 144;
            font-variant-numeric: tabular-nums oldstyle-nums;
            color: var(--ink);
            line-height: 1;
            letter-spacing: -0.025em;
            display: inline-block;
            min-width: 120px;
            text-align: center;
            animation: inkFlash 240ms ease;
        }

        .beans-unit {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 22px;
            color: var(--crema);
            margin-top: 0;
            letter-spacing: 0;
            line-height: 1;
            align-self: baseline;
            transform: translateY(-0.32em);
        }

        .edit-pencil-icon {
            width: 11px;
            height: 11px;
            color: var(--text-muted);
            opacity: 0.55;
            margin-top: 0;
            align-self: center;
            margin-left: 6px;
        }

        .beans-input-hidden {
            display: none;
            width: 120px;
            height: auto;
            font-family: var(--serif);
            font-size: 68px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.025em;
            font-variation-settings: "SOFT" 40, "WONK" 1, "opsz" 144;
            color: var(--ink);
            font-variant-numeric: tabular-nums oldstyle-nums;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            cursor: text;
            -moz-appearance: textfield;
        }
        .beans-input-hidden::-webkit-outer-spin-button,
        .beans-input-hidden::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .dose-caption {
            font-family: var(--sans);
            font-size: 9.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.36em;
            color: var(--text-muted);
            text-align: center;
        }

        /* === Slider — ruler === */
        .grinder-slider-box {
            position: relative;
            width: 92%;
            padding: 12px 0 4px;
            display: flex;
            align-items: center;
            touch-action: none;
            cursor: ew-resize;
            margin: 0 auto;
        }
        .grinder-fine-ticks {
            position: absolute;
            left: 4px;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            height: 14px;
            background:
                linear-gradient(90deg, rgba(26, 14, 7, 0.55) 1px, transparent 1px) repeat-x,
                linear-gradient(90deg, rgba(26, 14, 7, 0.25) 1px, transparent 1px) repeat-x;
            background-size: 10% 100%, 2% 60%;
            pointer-events: none;
        }
        .grinder-fine-ticks::after {
            content: "";
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 1px;
            background: rgba(26, 14, 7, 0.55);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            outline: none;
            margin: 0;
            cursor: ew-resize;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 3px;
            height: 22px;
            border-radius: 0;
            background: var(--crema);
            box-shadow: 0 0 0 1px var(--ink);
        }
        input[type="range"]::-moz-range-thumb {
            width: 3px;
            height: 22px;
            border-radius: 0;
            background: var(--crema);
            border: none;
            box-shadow: 0 0 0 1px var(--ink);
        }

        /* === Selects === */
        .select-wrapper {
            position: relative;
            display: block;
            border: 1px solid var(--ink);
            border-radius: 0;
            background-color: var(--card);
            overflow: hidden;
            width: 100%;
            height: 44px;
        }
        select {
            width: 100%;
            height: 100%;
            padding: 0 36px 0 14px;
            border: none;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: var(--ink);
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        .select-wrapper::after {
            content: "▾";
            font-size: 12px;
            color: var(--espresso);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border-left: 1px solid var(--ink);
            pointer-events: none;
        }
        .select-wrapper.locked::after { display: none; }
        .select-wrapper.locked select { cursor: default; padding-right: 14px; }
        select:disabled {
            color: var(--ink);
            -webkit-text-fill-color: var(--ink);
            opacity: 1;
        }

        /* === Recipe details === */
        .recipe-details-box {
            margin-top: 14px;
            border: 1px solid var(--ink);
            border-radius: 0;
            overflow: hidden;
            background: var(--card);
            animation: fadeUp 600ms 440ms both;
        }
        summary {
            padding: 11px 14px;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            border-bottom: 1px solid var(--ink);
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: "";
            width: 5px; height: 5px;
            border-right: 1.5px solid var(--ink);
            border-bottom: 1.5px solid var(--ink);
            transform: rotate(45deg);
            transition: transform 220ms ease;
        }
        details[open] summary::after { transform: rotate(-135deg); }
        details:not([open]) summary { border-bottom: none; }

        .recipe-details-box .details-content { display: none; }
        details[open] .details-content {
            padding: 16px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
            background: var(--card);
        }

        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-item.full-width {
            grid-column: span 2;
            border-top: 1px solid var(--rule);
            padding-top: 12px;
            margin-top: 4px;
        }
        .info-label {
            font-family: var(--sans);
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.26em;
        }
        .info-value {
            font-family: var(--serif);
            color: var(--ink);
            font-weight: 400;
            font-size: 13.5px;
            line-height: 1.45;
            font-variant-numeric: tabular-nums oldstyle-nums;
        }

        /* === Brew table === */
        .result {
            margin-top: 18px;
            background-color: var(--card);
            border-radius: 0;
            border: 1px solid var(--ink);
            overflow: hidden;
            animation: fadeUp 700ms 540ms both;
        }
        .result h3 {
            margin: 0;
            padding: 11px 14px;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--ink);
        }
        .result-body {
            padding: 18px 16px 8px;
            background: var(--card);
            counter-reset: step;
        }

        .total-highlight {
            font-family: var(--sans);
            font-size: 10.5px;
            margin: 0 0 18px;
            background: transparent;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            padding: 14px 0;
            border-radius: 0;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.85;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }
        .total-highlight strong {
            font-family: var(--serif);
            font-weight: 500;
            color: var(--ink);
            text-transform: none;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums oldstyle-nums;
        }
        .dashboard-total {
            color: var(--crema);
            font-size: 20px;
            font-style: italic;
            font-weight: 500;
        }

        .step {
            margin: 0;
            padding: 16px 0 18px 42px;
            border-bottom: 1px solid var(--rule);
            position: relative;
            counter-increment: step;
        }
        .step::before {
            content: counter(step, decimal-leading-zero);
            position: absolute;
            left: 0; top: 14px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 22px;
            color: var(--crema);
            font-variant-numeric: tabular-nums oldstyle-nums;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .step:first-child { padding-top: 4px; }
        .step:first-child::before { top: 2px; }
        .step:last-child { border-bottom: none; padding-bottom: 4px; }

        .step-title {
            font-family: var(--sans);
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 6px;
            display: block;
            font-size: 10.5px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .step-details {
            font-family: var(--serif);
            font-size: 14px;
            color: var(--ink);
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums oldstyle-nums;
        }
        .step-cumulative {
            color: var(--ink);
            font-size: 17px;
            font-weight: 500;
            font-style: normal;
        }
        .step-delta {
            color: var(--text-muted);
            font-size: 11px;
            font-family: var(--sans);
            font-style: italic;
            letter-spacing: 0.04em;
        }
        .step-note {
            font-family: var(--serif);
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.55;
            font-style: italic;
        }

        .colophon {
            text-align: center;
            margin: 28px 0 0;
            padding: 14px 0 4px;
            font-family: var(--sans);
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            animation: fadeUp 700ms 640ms both;
        }
        .colophon em {
            font-family: var(--serif);
            font-style: italic;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="edition-mark">№ 01</div>

    <div class="brand-header">
        <div class="en-title">Coffee Brewing Assistant</div>
        <div class="zh-title">咖啡冲煮助手 · <em>vol. v</em></div>
    </div>

    <div class="input-group">
        <div class="glass-panel">
            <div class="center-display-wrapper" id="displayWrapper" onclick="enableManualInput()">
                <span class="beans-large-text" id="beansValue">15.0</span>
                <input type="number" id="beansInput" class="beans-input-hidden" step="0.1" min="0.1" max="9999" inputmode="decimal" onblur="disableManualInput()">
                <span class="beans-unit">g</span>
                <svg class="edit-pencil-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path>
                </svg>
            </div>
            <div class="dose-caption">Dose · 咖啡粉重量</div>
            <div class="grinder-slider-box">
                <div class="grinder-fine-ticks"></div>
                <input type="range" id="beansSlider" min="10" max="20" step="0.1" value="15.0" oninput="syncFromSlider(this.value)">
            </div>
        </div>
    </div>

    <div class="grid-two-columns">
        <div class="input-group">
            <label for="recipe">冲煮方案:</label>
            <div class="select-wrapper" id="recipeWrapper">
                <select id="recipe" onchange="onRecipeChange()">
                    <option value="classic" selected>经典三段式</option>
                    <option value="four_six">粕谷哲 四六冲煮法</option>
                    <option value="one_pour">极致一刀流</option>
                    <option value="carlos">Carlos 五段精准法</option>
                    <option value="du">杜嘉宁 高温快冲法</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="ratio">粉水比:</label>
            <div class="select-wrapper" id="ratioWrapper">
                <select id="ratio" onchange="onRatioChange()">
                    <option value="15">1 : 15</option>
                    <option value="16">1 : 16</option>
                    <option value="16.1" style="display:none;">1 : 16.1</option>
                </select>
            </div>
        </div>
    </div>

    <details class="recipe-details-box" id="recipeDetails">
        <summary>冲煮方案</summary>
        <div class="details-content">
            <div class="info-item"><span class="info-label">推荐水温</span><span class="info-value" id="viewTemp">-</span></div>
            <div class="info-item"><span class="info-label">推荐器具</span><span class="info-value" id="viewGear">-</span></div>
            <div class="info-item"><span class="info-label">研磨度锚点</span><span class="info-value" id="viewGrind">-</span></div>
            <div class="info-item"><span class="info-label">预估时间</span><span class="info-value" id="viewTime">-</span></div>
            <div class="info-item full-width"><span class="info-label">方案核心设计哲学</span><span class="info-value" id="viewFlavor">-</span></div>
        </div>
    </details>

    <div id="resultBox" class="result">
        <h3>冲煮看板</h3>
        <div class="result-body">
            <div class="total-highlight">
                目标总水：<strong id="totalWater" class="dashboard-total"></strong> g
                | 粉水比：<strong><span id="currentRatio"></span></strong>
                | 咖啡粉重量：<strong id="currentBeans"></strong> g
            </div>
            <div id="stepsList"></div>
        </div>
    </div>
</div>

<div class="colophon">Brewed locally · <em>coffee.caic.ac.cn</em></div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js?v=6.0')
                .then(reg => console.log('PWA 已成功部署。'))
                .catch(err => console.log(err));
        });
    }

    const sliderEl = document.getElementById('beansSlider');
    const textEl = document.getElementById('beansValue');
    const inputEl = document.getElementById('beansInput');
    const ratioSelect = document.getElementById('ratio');

    const RECIPE_KEY = 'coffee.recipe';
    const BEANS_KEY = 'coffee.beans';

    function saveBeans(v) {
        try { localStorage.setItem(BEANS_KEY, parseFloat(v).toFixed(1)); } catch (_) {}
    }

    function syncFromSlider(val) {
        const v = parseFloat(val).toFixed(1);
        textEl.innerText = v;
        inputEl.value = v;
        saveBeans(v);
        renderDashboard();
    }

    function enableManualInput() {
        if (textEl.style.display === 'none') return;
        textEl.style.display = 'none';
        inputEl.style.display = 'inline-block';
        inputEl.value = textEl.innerText;
        inputEl.focus();
        inputEl.select();
    }

    function disableManualInput() {
        let val = parseFloat(inputEl.value);
        if (isNaN(val) || val <= 0) val = parseFloat(textEl.innerText) || 15;

        val = Number(val.toFixed(1));

        const sMin = parseFloat(sliderEl.min);
        const sMax = parseFloat(sliderEl.max);

        textEl.innerText = val.toFixed(1);
        inputEl.value = val.toFixed(1);
        sliderEl.value = Math.max(sMin, Math.min(sMax, val));
        saveBeans(val);

        inputEl.style.display = 'none';
        textEl.style.display = '';
        renderDashboard();

    (function initRelativeDragSlider() {
        const box = document.querySelector('.grinder-slider-box');
        if (!box) return;
        let dragging = false;
        let startX = 0;
        let startValue = 0;
        let activePointerId = null;

        function onDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragging = true;
            activePointerId = e.pointerId;
            startX = e.clientX;
            startValue = parseFloat(sliderEl.value);
            try { box.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        }

        function onMove(e) {
            if (!dragging || e.pointerId !== activePointerId) return;
            const rect = box.getBoundingClientRect();
            const min = parseFloat(sliderEl.min);
            const max = parseFloat(sliderEl.max);
            const step = parseFloat(sliderEl.step) || 0.1;
            const range = max - min;
            const deltaX = e.clientX - startX;
            let v = startValue + (deltaX / rect.width) * range;
            v = Math.round(v / step) * step;
            v = Math.max(min, Math.min(max, v));
            v = Number(v.toFixed(1));
            if (parseFloat(sliderEl.value) !== v) {
                sliderEl.value = v;
                syncFromSlider(v);
            }
            e.preventDefault();
        }

        function onUp(e) {
            if (e.pointerId !== activePointerId) return;
            dragging = false;
            activePointerId = null;
            try { box.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        box.addEventListener('pointerdown', onDown);
        box.addEventListener('pointermove', onMove);
        box.addEventListener('pointerup', onUp);
        box.addEventListener('pointercancel', onUp);
    })();

    function updateRecipeDetailsView() {
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];

        document.getElementById('viewTemp').innerText = recipe.temp;
        document.getElementById('viewGear').innerText = recipe.gear;
        document.getElementById('viewGrind').innerText = recipe.grind;
        document.getElementById('viewTime').innerText = recipe.time;
        document.getElementById('viewFlavor').innerText = recipe.flavor;

        const ratioWrapper = document.getElementById('ratioWrapper');
        if (recipe.hasDynamicRatio) {
            ratioSelect.disabled = false;
            ratioWrapper.classList.remove('locked');
            if (recipe.defaultRatio) ratioSelect.value = recipe.defaultRatio;
        } else {
            ratioSelect.value = recipe.fixedRatio.toString();
            ratioSelect.disabled = true;
            ratioWrapper.classList.add('locked');
        }
    }

    function onRatioChange() {
        renderDashboard();
    }

    function applyRecipeKey(key, { writeHash = true, persist = true } = {}) {
        if (!recipes[key]) return false;
        const sel = document.getElementById('recipe');
        if (sel.value !== key) sel.value = key;
        updateRecipeDetailsView();
        if (persist) {
            try { localStorage.setItem(RECIPE_KEY, key); } catch (_) {}
        }
        if (writeHash && location.hash.replace(/^#/, '') !== key) {
            try { history.replaceState(null, '', '#' + key); } catch (_) { location.hash = key; }
        }
        return true;
    }

    function onRecipeChange() {
        applyRecipeKey(document.getElementById('recipe').value);
        renderDashboard();
    }

    window.addEventListener('hashchange', () => {
        const k = location.hash.replace(/^#/, '');
        if (recipes[k] && document.getElementById('recipe').value !== k) {
            applyRecipeKey(k, { writeHash: false });
            renderDashboard();
        }
    });

    function renderDashboard() {
        const beans = parseFloat(inputEl.value || textEl.innerText);
        if (!beans || beans <= 0) return;
        const recipeKey = document.getElementById('recipe').value;
        const recipe = recipes[recipeKey];
        if (!recipe) return;

        const activeRatio = recipe.hasDynamicRatio ? parseFloat(ratioSelect.value) : recipe.fixedRatio;
        const totalWater = beans * activeRatio;
        document.getElementById('totalWater').innerText = totalWater.toFixed(1);
        document.getElementById('currentRatio').innerText = `1 : ${activeRatio}`;
        document.getElementById('currentBeans').innerText = beans.toFixed(1);

        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = '';
        let cumulativeWater = 0;

        recipe.steps.forEach((step) => {
            const stepWater = totalWater * step.percentage;
            cumulativeWater += stepWater;
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            stepDiv.innerHTML = `<div class="step-title">${step.name}</div><div class="step-details">注水至：<strong class="step-cumulative">${cumulativeWater.toFixed(1)}g</strong> <span class="step-delta">· +${stepWater.toFixed(1)}g, ${(step.percentage * 100).toFixed(0)}%</span></div><div class="step-note">${step.note}</div>`;
            stepsList.appendChild(stepDiv);
        });
    }

    const detailsEl = document.getElementById('recipeDetails');
    const DETAILS_KEY = 'coffee.recipeDetailsOpen';
    detailsEl.addEventListener('toggle', () => {
        try { localStorage.setItem(DETAILS_KEY, detailsEl.open ? '1' : '0'); } catch (_) {}
    });

    window.onload = function() {
        const hashKey = location.hash.replace(/^#/, '');
        let initialRecipe = null;
        if (recipes[hashKey]) {
            initialRecipe = hashKey;
        } else {
            try {
                const stored = localStorage.getItem(RECIPE_KEY);
                if (recipes[stored]) initialRecipe = stored;
            } catch (_) {}
        }
        if (!initialRecipe) initialRecipe = 'classic';
        applyRecipeKey(initialRecipe);

        let savedBeans = NaN;
        try { savedBeans = parseFloat(localStorage.getItem(BEANS_KEY)); } catch (_) {}
        if (!isNaN(savedBeans) && savedBeans > 0) {
            const sMin = parseFloat(sliderEl.min);
            const sMax = parseFloat(sliderEl.max);
            const v = Number(savedBeans.toFixed(1));
            textEl.innerText = v.toFixed(1);
            inputEl.value = v.toFixed(1);
            sliderEl.value = Math.max(sMin, Math.min(sMax, v));
        } else {
            syncFromSlider(sliderEl.value);
        }

        let savedOpen = null;
        try { savedOpen = localStorage.getItem(DETAILS_KEY); } catch (_) {}
        if (savedOpen === '1') detailsEl.setAttribute('open', '');
        else if (savedOpen === '0') detailsEl.removeAttribute('open');

        renderDashboard();
    };
